# demo-api, deployed by digest. The digest line is updated by the supply-chain pipeline in
# prhoguns/devsecops-supply-chain after the image passes its gates and is signed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo
labels:
  - pairs:
      app.kubernetes.io/part-of: demo-api
    includeSelectors: false
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - loadgen.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
images:
  - name: demo-api
    newName: ghcr.io/prhoguns/demo-api
    digest: sha256:3882f818f988f44709ec5e3d80443f9f51a2a913fdaa6a4a999302cb8e446598
