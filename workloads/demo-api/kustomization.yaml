# demo-api, deployed by digest. The digest line is updated by the supply-chain pipeline in
# prhoguns/devsecops-supply-chain after the image passes its gates and is signed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo
labels:
  - pairs:
      app.kubernetes.io/part-of: demo-api
    includeSelectors: false
resources:
  - serviceaccount.yaml
  - rollout.yaml
  - analysis.yaml
  - service.yaml
  - loadgen.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
images:
  - name: demo-api
    newName: ghcr.io/prhoguns/demo-api
    digest: sha256:4e6f3aad3df9a96ea6984ac2b73dc7b93ef89d872efc7204249fee766339bdb5
