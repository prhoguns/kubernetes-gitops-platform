apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-api
spec:
  groups:
    - name: demo-api
      rules:
        - record: demo_api:request_error_ratio:rate1m
          expr: |
            sum(rate(http_requests_total{job="demo-api", status=~"5.."}[1m]))
            /
            sum(rate(http_requests_total{job="demo-api"}[1m]))
        - alert: DemoApiHighErrorRate
          expr: demo_api:request_error_ratio:rate1m > 0.05
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: demo-api is failing {{ $value | humanizePercentage }} of requests
            description: More than 5% of demo-api requests returned 5xx for over a minute.
        - alert: DemoApiHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{job="demo-api"}[5m]))) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: demo-api p95 latency is {{ $value | humanizeDuration }}
        - alert: DemoApiDown
          expr: absent(up{job="demo-api"} == 1)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: No demo-api instance is being scraped successfully
