# demo-api is released as a canary by Argo Rollouts instead of a plain rolling update:
#   25% of pods run the new version -> 30 s bake -> Prometheus analysis of the canary's own error
#   rate -> 50% -> 100%. If the analysis fails, the rollout aborts and every pod goes back to the
#   stable version on its own; most traffic never sees the bad release.
# (No CPU limits on purpose: requests reserve CPU, limits would only throttle.)
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-api
  labels:
    app.kubernetes.io/name: demo-api
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  strategy:
    canary:
      # Rollouts points these at the canary and stable pods respectively; the plain demo-api
      # Service keeps selecting both, so traffic splits roughly by pod count.
      canaryService: demo-api-canary
      stableService: demo-api-stable
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: canary-error-rate
        - setWeight: 50
        - pause: { duration: 30s }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
    spec:
      serviceAccountName: demo-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread the replicas over the workers so one node failure cannot take the service down.
      #  - nodeTaintsPolicy: Honor  ignores nodes the pod cannot run on (the tainted control plane),
      #    which would otherwise count as an empty zone and block every rollout.
      #  - matchLabelKeys           spreads each revision on its own, so a canary pod is not blocked
      #    by the stable revision's pods.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys: [rollouts-pod-template-hash]
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: demo-api
      containers:
        - name: demo-api
          image: demo-api
          ports:
            - name: http
              containerPort: 8080
          env:
            # Fraction of /api/work requests that fail on purpose. Raise it in Git to watch a bad
            # release: the canary fires DemoApiHighErrorRate, fails its analysis and is rolled back.
            - name: ERROR_RATE
              value: "0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
