# Steady traffic so the dashboards and alerts have something to measure. Uses the same signed
# image as the API with a different entrypoint module.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  annotations:
    checkov.io/skip1: CKV_K8S_11=CPU limits intentionally not set; requests reserve CPU, limits would only throttle
    checkov.io/skip2: CKV_K8S_8=no HTTP server to probe; the kubelet restarts the process if it exits
    checkov.io/skip3: CKV_K8S_9=no HTTP server and receives no traffic, so readiness has no meaning
  labels:
    app.kubernetes.io/name: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
    spec:
      serviceAccountName: demo-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: demo-api
          args: ["-m", "app.loadgen"]
          env:
            - name: TARGET_URL
              value: http://demo-api/api/work
            - name: INTERVAL_SECONDS
              value: "0.2"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
