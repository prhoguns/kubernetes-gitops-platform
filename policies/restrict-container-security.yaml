# Containers must run as non-root, without privilege escalation, with all Linux capabilities
# dropped and a read-only root filesystem. Mirrors the Pod Security "restricted" profile, which the
# workload namespaces also enforce, but gives a clear message naming the offending container.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-container-security
  annotations:
    policies.kyverno.io/title: Restrict container security context
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      # Also check Deployments, StatefulSets, etc. at admission, so a bad spec is rejected when
      # it is applied instead of silently failing to create pods later.
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      # Platform namespaces run third-party charts and are governed separately. Every other
      # namespace, including new ones, is covered by default.
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, local-path-storage, kyverno, argocd, argo-rollouts, monitoring]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: podRunAsNonRoot
      expression: object.spec.?securityContext.?runAsNonRoot.orValue(false)
  validations:
    - expression: >-
        variables.containers.all(c,
          c.?securityContext.?runAsNonRoot.orValue(variables.podRunAsNonRoot) == true)
      messageExpression: >-
        'containers must set runAsNonRoot: true (pod or container level); failing: ' +
        variables.containers.filter(c,
          c.?securityContext.?runAsNonRoot.orValue(variables.podRunAsNonRoot) != true)
          .map(c, c.name).join(', ')
    - expression: >-
        variables.containers.all(c, c.?securityContext.?runAsUser.orValue(
          object.spec.?securityContext.?runAsUser.orValue(1)) != 0)
      message: containers must not set runAsUser to 0 (root)
    - expression: variables.containers.all(c, c.?securityContext.?privileged.orValue(false) == false)
      message: privileged containers are not allowed
    - expression: >-
        variables.containers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: 'containers must set allowPrivilegeEscalation: false'
    - expression: >-
        variables.containers.all(c, 'ALL' in c.?securityContext.?capabilities.?drop.orValue([]))
      message: containers must drop ALL Linux capabilities
    - expression: >-
        variables.containers.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false) == true)
      message: 'containers must set readOnlyRootFilesystem: true'
