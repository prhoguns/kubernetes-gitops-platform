# Single replicas for a local cluster. In production run 3 admission controller replicas so a
# node failure cannot block all pod creation (the policies fail closed).
admissionController:
  replicas: 1
backgroundController:
  replicas: 1
cleanupController:
  replicas: 1
reportsController:
  replicas: 1

# The kyverno-api subchart renders `labels: {}` on the policies.kyverno.io CRDs when no labels are
# set. The API server drops empty maps, so Argo CD would report those CRDs as permanently
# OutOfSync. Giving them a real label removes the phantom diff without hiding real drift.
kyverno-api:
  labels:
    app.kubernetes.io/part-of: kyverno
