# CI for the platform repo.
#
#   static   fast checks: formatting, Terraform validate + mocked-provider tests for the EKS/AKS
#            modules, Helm lint, schema validation of every rendered manifest, offline Kyverno
#            policy tests, Checkov and ShellCheck
#   e2e      boots a real 3-node kind cluster, bootstraps it from THIS commit exactly as
#            scripts/up.sh does locally, and runs tests/e2e.sh against it
#
# Every promotion commit from the supply-chain pipeline runs this too, so no image digest reaches
# main without the whole platform being rebuilt and tested around it.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TERRAFORM_VERSION: 1.16.4
  HELM_VERSION: v4.3.0
  KUBECTL_VERSION: v1.37.1

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Terraform format
        run: terraform fmt -check -recursive infra
      - name: Terraform validate (bootstrap)
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate
      - name: Terraform validate and test (EKS and AKS modules, mocked providers)
        run: |
          for m in eks aks; do
            terraform -chdir=infra/modules/$m init -backend=false -input=false
            terraform -chdir=infra/modules/$m validate
            terraform -chdir=infra/modules/$m test
          done

      - name: Helm lint (app of apps)
        run: helm lint argocd/apps --strict
      - name: Render manifests
        run: |
          mkdir -p rendered
          helm template root argocd/apps > rendered/apps.yaml
          kubectl kustomize workloads/demo-api > rendered/workloads.yaml
          kubectl kustomize platform/config > rendered/platform.yaml
          kubectl kustomize policies > rendered/policies.yaml
      - name: Schema-validate rendered manifests (kubeconform, including CRDs)
        run: |
          docker run --rm -v "$PWD/rendered:/r" ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -kubernetes-version 1.37.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /r
      - name: Kyverno policy unit tests (offline)
        run: docker run --rm -v "$PWD/policies:/p" -w /p ghcr.io/kyverno/kyverno-cli:v1.19.1 test tests
      - name: Checkov (Terraform and Kubernetes)
        run: |
          docker run --rm -v "$PWD:/src" -w /src bridgecrew/checkov:3.3.19 \
            -d infra --framework terraform --skip-path .terraform --compact --quiet
          docker run --rm -v "$PWD/rendered:/src" -w /src bridgecrew/checkov:3.3.19 \
            -f workloads.yaml -f platform.yaml --framework kubernetes --compact --quiet
      - name: ShellCheck
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable -x scripts/*.sh tests/e2e.sh

  e2e:
    name: End-to-end on kind
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # For pull requests test the branch head (the merge ref is not fetchable by Argo CD).
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Install kind and kubectl
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: v0.33.0
          kubectl_version: ${{ env.KUBECTL_VERSION }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Create cluster
        run: kind create cluster --config kind/cluster.yaml --wait 180s
      - name: Preload Argo CD images (public registries rate-limit shared CI IPs)
        run: scripts/preload-images.sh
      - name: Bootstrap Argo CD from this commit
        run: scripts/up.sh
      - name: End-to-end tests
        run: tests/e2e.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n argocd get applications -o wide || true
          kubectl get pods -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          kubectl -n argocd get applications -o yaml | grep -A10 -E 'conditions:|operationState:' || true
